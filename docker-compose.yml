services:
  db:
    image: postgres:16
    container_name: kryptoskatt-db
    environment:
      POSTGRES_USER: kryptoskatt
      POSTGRES_PASSWORD: kryptoskatt
      POSTGRES_DB: kryptoskatt
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kryptoskatt -d kryptoskatt"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kryptoskatt-app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - "8000:8000"
    volumes:
      - ./tests:/home/appuser/tests

volumes:
  postgres_data:
