[project]
name = "kryptoskatt"
dynamic = ["version"]
description = "Swedish crypto tax calculation CLI tool"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    {name = "KryptoSkatt Team", email = "info@kryptoskatt.se"}
]
keywords = ["crypto", "tax", "sweden", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "typer>=0.15.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "psycopg[binary]>=3.2",
    "jinja2>=3.1.5",
    "python-multipart>=0.0.18",
    "cryptography>=44.0.0",
    "qrcode>=8.0",
    "ecdsa>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
    "pytest-cov>=6.0.0",
    "pip-audit>=2.7.0",
    "mypy>=1.14.0",
]

[project.scripts]
kryptoskatt = "kryptoskatt.cli:app"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
# Single source of truth for the version: src/kryptoskatt/__init__.py
version = {attr = "kryptoskatt.__version__"}

[tool.setuptools.package-data]
kryptoskatt = [
    "web/templates/**/*",
    "web/templates/*",
    "data/*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "B904", "B007", "B905", "SIM108", "SIM105", "SIM117", "C416", "N806", "N812", "N817"]

[tool.mypy]
python_version = "3.12"
files = ["src/kryptoskatt"]
ignore_missing_imports = true
# Gradual typing: the core (services, engine, reports, parsers, cli, api,
# models, schemas) is type-checked. The chain adapters and the web/Jinja layer
# carry framework-typing noise (SQLAlchemy Column, list invariance on the
# adapter base) and are exempted below until they can be tightened incrementally.
check_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "kryptoskatt.chains.*",
    "kryptoskatt.web.*",
    "kryptoskatt.reports.t2",
    "kryptoskatt.parsers.coinbase",
    "kryptoskatt.parsers.crypto_com",
    "kryptoskatt.engine.dedup",
    "kryptoskatt.engine.gav",
    "kryptoskatt.api.v1.reports",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
