<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}KryptoSkatt{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        .container {
            max-width: 960px;
            padding-top: 1rem;
        }
        .header-nav {
            margin-bottom: 2rem;
        }
        .header-nav nav {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .header-nav h1 {
            margin-bottom: 0;
            margin-right: 2rem;
        }
        .table-container {
            overflow-x: auto;
        }
        .positive {
            color: #2d9e4a;
        }
        .negative {
            color: #d9534f;
        }
        .pagination {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1rem;
        }
        .download-buttons {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .summary-card {
            padding: 1.5rem;
            background: var(--pico-background-color);
            border: 1px solid var(--pico-muted-border-color);
            border-radius: var(--pico-border-radius);
        }
        .summary-card h3 {
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--pico-muted-color);
        }
        .summary-card p {
            margin-bottom: 0;
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <main class="container">
        <header class="header-nav">
            <nav>
                <h1>KryptoSkatt</h1>
                <a href="/">Dashboard</a>
            </nav>
        </header>
        
        {% block content %}{% endblock %}
        
    </main>
</body>
</html>
