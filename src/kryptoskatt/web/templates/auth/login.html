{% extends "base.html" %}
{% block title %}Logga in — KryptoSkatt{% endblock %}
{% block content %}
<div style="max-width:480px;margin:4rem auto">
  <h1>Logga in</h1>
  {% if error %}
  <p role="alert" style="color:var(--pico-del-color)"><strong>{{ error }}</strong></p>
  {% endif %}
  <form method="post" action="/auth/login">
    <label for="account_id">Konto-ID</label>
    <input type="text" id="account_id" name="account_id" placeholder="ord-ord-ord-0000" required autofocus>
    <button type="submit">Logga in</button>
  </form>
  <hr>
  <form method="post" action="/auth/create">
    <button type="submit" class="secondary outline">Skapa nytt konto</button>
  </form>
</div>
{% endblock %}
